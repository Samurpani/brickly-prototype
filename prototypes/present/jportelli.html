<!-- ════════════════════════════════════════════════════════════
     PRESENT MODE — full-screen buyer showroom experience
════════════════════════════════════════════════════════════ -->
<style id="pm-styles">
#present-mode{
  --pm-bg:#e9e4d8; --pm-panel:rgba(255,255,255,0.72); --pm-panel2:rgba(255,255,255,0.96);
  --pm-border:rgba(40,32,16,0.09); --pm-border2:rgba(40,32,16,0.17);
  --pm-ac:#e8590c; --pm-ac2:#f5a623; --pm-ac-dim:rgba(232,89,12,0.09); --pm-ac-bd:rgba(232,89,12,0.42);
  --pm-t:#211e17; --pm-t2:#6f695b; --pm-t3:#a49d8c;
  --pm-dark:#24211b; --pm-amber:#f5a623; --pm-red:#d64533;
  --pm-sh:0 14px 38px -10px rgba(95,70,30,0.16);
  display:none; position:fixed; inset:0; z-index:6000;
  background:
    radial-gradient(900px 620px at 10% 12%, rgba(242,140,52,0.30), transparent 62%),
    radial-gradient(760px 540px at 92% 88%, rgba(245,166,35,0.18), transparent 60%),
    linear-gradient(158deg,#f2eee5 0%,#e8e2d4 52%,#d7cfbd 100%);
  color:var(--pm-t); font-family:"Space Grotesk",sans-serif;
  flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#present-mode.on{display:flex}
#present-mode *{box-sizing:border-box}
#present-mode .pm-topbar,#present-mode .pm-rail,#present-mode .pm-canvas-wrap,#present-mode .pm-customizer,#present-mode .pm-plan-box{user-select:none;-webkit-user-select:none}
#present-mode ::-webkit-scrollbar{width:8px;height:8px}
#present-mode ::-webkit-scrollbar-thumb{background:rgba(40,32,16,0.18);border-radius:4px}

/* ── Top bar ── */
.pm-topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 22px;border-bottom:1px solid var(--pm-border);background:rgba(248,245,238,0.6);backdrop-filter:blur(16px);flex-shrink:0;z-index:20}
.pm-brand{font-weight:700;font-size:14px;letter-spacing:0.12em;display:flex;align-items:center;gap:9px;white-space:nowrap;color:var(--pm-t)}
.pm-brand .pm-brand-badge{background:linear-gradient(135deg,var(--pm-ac),var(--pm-ac2));color:#fff;font-size:9px;font-weight:800;letter-spacing:0.16em;padding:3px 8px;border-radius:6px}
.pm-steps{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,0.55);border:1px solid var(--pm-border);border-radius:100px;padding:4px;backdrop-filter:blur(10px)}
.pm-step{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:100px;font-size:11px;font-weight:600;color:var(--pm-t3);cursor:default;border:1px solid transparent;transition:all .18s;white-space:nowrap}
.pm-step.reachable{cursor:pointer;color:var(--pm-t2)}
.pm-step.reachable:hover{background:rgba(255,255,255,0.8);color:var(--pm-t)}
.pm-step.cur{background:#fff;color:var(--pm-t);box-shadow:0 3px 12px rgba(90,65,25,0.14)}
.pm-step .pm-step-n{width:16px;height:16px;border-radius:50%;background:rgba(40,32,16,0.07);color:var(--pm-t2);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}
.pm-step.cur .pm-step-n{background:linear-gradient(135deg,var(--pm-ac),var(--pm-ac2));color:#fff}
.pm-step-sep{display:none}
.pm-top-right{display:flex;align-items:center;gap:9px}
.pm-buyer-chip{display:none;align-items:center;gap:8px;background:rgba(255,255,255,0.7);border:1px solid var(--pm-ac-bd);border-radius:100px;padding:5px 13px 5px 6px;font-size:11px;font-weight:600;color:var(--pm-t);backdrop-filter:blur(8px)}
.pm-buyer-chip.on{display:flex}
.pm-buyer-av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--pm-ac),var(--pm-ac2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}
.pm-chip-btn{background:rgba(255,255,255,0.66);border:1px solid var(--pm-border);color:var(--pm-t2);border-radius:100px;padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;backdrop-filter:blur(8px)}
.pm-chip-btn:hover{background:#fff;color:var(--pm-t);box-shadow:0 4px 14px rgba(90,65,25,0.12)}
.pm-chip-btn.hot{border-color:var(--pm-ac-bd);color:var(--pm-ac)}
.pm-exit{background:transparent;border:1px solid var(--pm-border);color:var(--pm-t3);border-radius:100px;padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.pm-exit:hover{border-color:rgba(214,69,51,0.5);color:var(--pm-red);background:rgba(255,255,255,0.6)}
#present-mode.pm-hide-prices .pm-price{filter:blur(7px);opacity:0.55;pointer-events:none}

/* ── Stage / screens ── */
.pm-stage{flex:1;position:relative;overflow:hidden}
.pm-screen{position:absolute;inset:0;display:none;overflow-y:auto;animation:pmFade .35s ease}
.pm-screen.on{display:block}
@keyframes pmFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── Lobby: consultation filters + cards + live map ── */
.pm-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--pm-ac);margin-bottom:12px}
.pm-h1{font-size:40px;font-weight:600;letter-spacing:-0.03em;line-height:1.06;margin:0 0 10px;color:var(--pm-t)}
.pm-sub{font-size:14px;color:var(--pm-t2);max-width:560px;line-height:1.55}
.pm-lobby2{position:absolute;inset:0;display:flex;overflow:hidden}
.pm-lob-left{width:520px;flex-shrink:0;display:flex;flex-direction:column;padding:24px 22px 0 28px;overflow:hidden}
.pm-lob-head .pm-eyebrow{margin-bottom:7px}
.pm-lob-head h1{font-size:25px;font-weight:600;letter-spacing:-0.03em;line-height:1.1;margin:0;color:var(--pm-t)}
.pm-lob-count{font-size:11.5px;color:var(--pm-t2);margin-top:6px}
.pm-lob-count b{color:var(--pm-ac);font-weight:700}
/* Filter bar */
.pm-filterbar{background:var(--pm-panel);border:1px solid var(--pm-border);border-radius:18px;padding:14px 16px 13px;margin-top:14px;box-shadow:var(--pm-sh);backdrop-filter:blur(10px)}
.pm-f-row{display:flex;gap:12px;align-items:stretch}
.pm-f-group{flex:1}
.pm-f-label{font-family:var(--mono);font-size:8.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--pm-t3);margin-bottom:7px}
.pm-stepper{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--pm-border);border-radius:13px;padding:4px;height:44px}
.pm-stp-btn{width:36px;height:34px;border-radius:10px;border:none;background:rgba(40,32,16,0.05);color:var(--pm-t);font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .13s;flex-shrink:0;line-height:1}
.pm-stp-btn:hover{background:linear-gradient(135deg,var(--pm-ac),var(--pm-ac2));color:#fff}
.pm-stp-btn:disabled{opacity:0.3;cursor:default;background:rgba(40,32,16,0.05);color:var(--pm-t)}
.pm-stp-val{flex:1;text-align:center;font-size:13.5px;font-weight:700;color:var(--pm-t);white-space:nowrap}
.pm-f-reset{align-self:flex-end;height:44px;padding:0 14px;border-radius:13px;border:1px solid var(--pm-border);background:transparent;color:var(--pm-t3);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .13s}
.pm-f-reset:hover{color:var(--pm-red);border-color:rgba(214,69,51,0.4)}
.pm-fchips{display:flex;flex-wrap:wrap;gap:6px}
.pm-fchip{font-size:11px;font-weight:600;padding:7px 13px;border-radius:100px;border:1px solid var(--pm-border);background:#fff;color:var(--pm-t2);cursor:pointer;font-family:inherit;transition:all .14s}
.pm-fchip:hover{border-color:var(--pm-border2);color:var(--pm-t)}
.pm-fchip.on{background:linear-gradient(135deg,var(--pm-ac),var(--pm-ac2));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(220,100,20,0.3)}
/* Cards list */
.pm-lob-cards{flex:1;overflow-y:auto;margin-top:12px;padding:2px 4px 24px 2px;display:flex;flex-direction:column;gap:10px}
.pm-lcard{display:flex;align-items:center;gap:13px;background:var(--pm-panel);border:1px solid var(--pm-border);border-radius:17px;padding:11px 14px 11px 11px;cursor:pointer;transition:all .18s;box-shadow:0 6px 20px -8px rgba(95,70,30,0.12);backdrop-filter:blur(8px)}
.pm-lcard:hover,.pm-lcard.hl{transform:translateX(3px);border-color:var(--pm-ac-bd);background:#fff;box-shadow:0 14px 32px -12px rgba(210,110,30,0.3)}
.pm-lcard.fit{border-color:var(--pm-ac-bd)}
.pm-lcard.off{opacity:0.45;cursor:default;filter:saturate(0.3)}
.pm-lcard.off:hover{transform:none;border-color:var(--pm-border);background:var(--pm-panel);box-shadow:0 6px 20px -8px rgba(95,70,30,0.12)}
.pm-lcard-thumb{position:relative;width:88px;height:66px;border-radius:11px;overflow:hidden;flex-shrink:0;border:1px solid var(--pm-border)}
.pm-lcard-body{flex:1;min-width:0}
.pm-lcard-top{display:flex;align-items:center;gap:8px}
.pm-lcard-name{font-size:14.5px;font-weight:700;letter-spacing:-0.01em;color:var(--pm-t)}
.pm-lcard-rec{font-size:8.5px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--pm-ac);background:var(--pm-ac-dim);border:1px solid var(--pm-ac-bd);border-radius:100px;padding:2.5px 8px}
.pm-lcard-loc{font-size:11px;color:var(--pm-t3);margin-top:2px}
.pm-lcard-meta{font-size:11.5px;color:var(--pm-t2);margin-top:5px}
.pm-lcard-meta b{color:var(--pm-t);font-weight:700}
.pm-lcard-meta .nomatch{color:var(--pm-t3);font-style:italic}
.pm-lcard-arrow{font-size:15px;color:var(--pm-ac);flex-shrink:0;transition:transform .18s}
.pm-lcard:hover .pm-lcard-arrow{transform:translateX(3px)}
/* Map */
#pm-island-host{flex:1;position:relative;overflow:hidden;background:#0c0b0a}
#pm-island-host canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#pm-island-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.pm-isl-label{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;transition:opacity .2s;font-family:var(--body);color:#f2efe8}
.pm-isl-label.occluded{opacity:0.25}
.pm-isl-label.hidden{opacity:0}
.pm-isl-label-name{font-size:16px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,0.8)}
.pm-isl-label-from{font-size:13px;color:#f5a623;margin-top:2px;text-shadow:0 2px 8px rgba(0,0,0,0.8)}
.pm-isl-label-beds{font-size:12px;color:rgba(242,239,232,0.8);margin-top:1px;text-shadow:0 2px 6px rgba(0,0,0,0.7)}
.pm-isl-label-rec{font-size:11px;color:#f5a623;margin-top:3px;text-shadow:0 2px 6px rgba(0,0,0,0.7)}
.pm-isl-hud{position:absolute;z-index:6;font-family:var(--mono);font-size:10px;letter-spacing:0.14em;color:rgba(242,239,232,0.75);padding:8px 14px;border-radius:8px;background:rgba(18,17,15,0.6);backdrop-filter:blur(10px);border:1px solid rgba(242,239,232,0.15)}
.pm-lob-map{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(600px 420px at 82% 16%, rgba(245,166,35,0.12), transparent 60%),
  linear-gradient(152deg,#e9ece3 0%,#dde3da 55%,#d2dad1 100%)}
.pm-lob-map svg{position:absolute;inset:0;width:100%;height:100%}
.pm-map-chip{position:absolute;z-index:5;font-family:var(--mono);font-size:9.5px;letter-spacing:0.14em;color:var(--pm-t2);background:rgba(255,255,255,0.7);border:1px solid var(--pm-border);padding:7px 14px;border-radius:100px;backdrop-filter:blur(8px);pointer-events:none;display:flex;align-items:center;gap:8px}
.pm-map-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--pm-ac);animation:pmBlink 1.4s infinite}
.pm-mpin{cursor:pointer}
.pm-mpin.off{cursor:default}
.pm-mpin .mp-pulse{fill:rgba(232,89,12,0.14);animation:pmMapPulse 2.4s infinite}
@keyframes pmMapPulse{0%{r:9;opacity:1}70%{r:22;opacity:0}100%{r:22;opacity:0}}
.pm-mpin .mp-label{fill:rgba(255,255,255,0.92);stroke:rgba(40,32,16,0.14);stroke-width:1;filter:drop-shadow(0 4px 8px rgba(95,70,30,0.18))}
.pm-mpin .mp-name{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:700;fill:#211e17}
.pm-mpin .mp-price{font-family:"IBM Plex Mono",monospace;font-size:8.5px;fill:#e8590c;letter-spacing:0.04em}
.pm-mpin.hl .mp-label,.pm-mpin:hover .mp-label{fill:#24211b;stroke:transparent}
.pm-mpin.hl .mp-name,.pm-mpin:hover .mp-name{fill:#fff}
.pm-mpin.hl .mp-price,.pm-mpin:hover .mp-price{fill:#f5a623}
.pm-mpin.hl .mp-core,.pm-mpin:hover .mp-core{stroke-width:4}
@media (max-width:1200px){.pm-lob-left{width:440px}}

/* ── Model / showroom ── */
.pm-model-layout{position:absolute;inset:0;display:flex}
.pm-canvas-wrap{flex:1;position:relative;overflow:hidden;cursor:grab}
.pm-canvas-wrap:active{cursor:grabbing}
#pm-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pm-model-title{position:absolute;top:22px;left:26px;z-index:5;pointer-events:none}
.pm-model-title .pm-eyebrow{margin-bottom:6px}
.pm-model-title h2{font-size:30px;font-weight:600;margin:0;letter-spacing:-0.03em;color:var(--pm-t)}
.pm-model-title .pm-loc{font-size:12px;color:var(--pm-t2);margin-top:4px}
.pm-hud-bl{position:absolute;left:26px;bottom:22px;z-index:10;display:flex;gap:8px;align-items:center}
.pm-hud-hint{position:absolute;bottom:26px;right:22px;z-index:5;font-family:var(--mono);font-size:10px;letter-spacing:0.08em;color:var(--pm-t3);background:rgba(255,255,255,0.6);border:1px solid var(--pm-border);padding:6px 14px;border-radius:100px;backdrop-filter:blur(8px);pointer-events:none;white-space:nowrap}
#pm-tooltip{position:absolute;z-index:8;display:none;pointer-events:none;background:rgba(255,255,255,0.92);border:1px solid var(--pm-border2);border-radius:14px;padding:11px 13px;backdrop-filter:blur(12px);min-width:180px;box-shadow:0 18px 44px rgba(95,70,30,0.22)}
#pm-tooltip .tt-id{font-family:var(--mono);font-size:10px;color:var(--pm-ac);letter-spacing:0.06em}
#pm-tooltip .tt-name{font-size:13px;font-weight:700;margin:3px 0 5px;color:var(--pm-t)}
#pm-tooltip .tt-row{font-size:11px;color:var(--pm-t2);display:flex;justify-content:space-between;gap:16px;margin-top:2px}
#pm-tooltip .tt-price{font-size:14px;font-weight:800;color:var(--pm-t);margin-top:7px}
#pm-tooltip .tt-cta{font-size:10px;color:var(--pm-ac);margin-top:6px;font-weight:600}
.pm-hotspot{position:absolute;z-index:7;transform:translate(-50%,-50%);width:27px;height:27px;border-radius:50%;background:rgba(255,255,255,0.75);border:1.5px solid var(--pm-ac);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;backdrop-filter:blur(5px);box-shadow:0 5px 16px rgba(210,110,30,0.28)}
.pm-hotspot:hover{transform:translate(-50%,-50%) scale(1.25)}
.pm-hotspot::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:1.5px solid rgba(232,89,12,0.45);animation:pmPulse 2.2s infinite}
@keyframes pmPulse{0%{transform:scale(0.75);opacity:1}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}
.pm-hotspot span{font-size:11px}
#pm-benefit-card{position:absolute;z-index:9;display:none;width:270px;background:rgba(255,255,255,0.94);border:1px solid var(--pm-ac-bd);border-radius:16px;padding:16px;backdrop-filter:blur(14px);box-shadow:0 24px 54px rgba(95,70,30,0.28)}
#pm-benefit-card .bc-icon{font-size:22px;margin-bottom:8px}
#pm-benefit-card .bc-title{font-size:15px;font-weight:700;color:var(--pm-t);letter-spacing:-0.01em}
#pm-benefit-card .bc-body{font-size:12px;color:var(--pm-t2);line-height:1.55;margin-top:6px}
#pm-benefit-card .bc-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--pm-t3);cursor:pointer;font-size:12px}

/* Model rail */
.pm-rail{width:320px;flex-shrink:0;border-left:1px solid var(--pm-border);background:rgba(252,250,245,0.72);backdrop-filter:blur(18px);display:flex;flex-direction:column;overflow:hidden}
.pm-rail-head{padding:18px 18px 12px;border-bottom:1px solid var(--pm-border)}
.pm-rail-title{font-size:13px;font-weight:700;color:var(--pm-t)}
.pm-rail-sub{font-size:11px;color:var(--pm-t3);margin-top:3px}
.pm-rail-filters{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.pm-rail-f{font-size:10px;font-weight:700;padding:4px 11px;border-radius:100px;border:1px solid var(--pm-border);background:rgba(255,255,255,0.5);color:var(--pm-t3);cursor:pointer;font-family:inherit;transition:all .15s}
.pm-rail-f.on{background:linear-gradient(135deg,var(--pm-ac),var(--pm-ac2));border-color:transparent;color:#fff}
.pm-rail-list{flex:1;overflow-y:auto;padding:10px}
.pm-unit-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;border:1px solid transparent;cursor:pointer;transition:all .15s}
.pm-unit-row:hover,.pm-unit-row.hl{background:#fff;border-color:var(--pm-border2);box-shadow:0 6px 18px rgba(95,70,30,0.10)}
.pm-unit-row.dis{opacity:0.45;cursor:default}
.pm-unit-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pm-unit-main{flex:1;min-width:0}
.pm-unit-id{font-family:var(--mono);font-size:10px;color:var(--pm-t3)}
.pm-unit-name{font-size:12.5px;font-weight:600;margin-top:1px;color:var(--pm-t)}
.pm-unit-specs{font-size:10.5px;color:var(--pm-t3);margin-top:2px}
.pm-unit-price{font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--pm-t)}
.pm-rail-benefits{padding:12px 18px 16px;border-top:1px solid var(--pm-border)}
.pm-rail-benefits .rb-title{font-family:var(--mono);font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--pm-t3);margin-bottom:9px}
.pm-benefit-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--pm-t2);background:rgba(255,255,255,0.65);border:1px solid var(--pm-border);border-radius:100px;padding:5px 11px;margin:0 5px 6px 0;cursor:pointer;transition:all .15s}
.pm-benefit-chip:hover{border-color:var(--pm-ac-bd);color:var(--pm-t);background:#fff}

/* Rail tabs + advanced filters */
.pm-rail-tabs{display:flex;gap:3px;background:rgba(40,32,16,0.05);border-radius:100px;padding:3px;margin-bottom:12px}
.pm-rail-tab{flex:1;text-align:center;font-size:11px;font-weight:700;padding:7px 0;border-radius:100px;border:none;background:transparent;color:var(--pm-t3);cursor:pointer;font-family:inherit;transition:all .15s}
.pm-rail-tab.on{background:#fff;color:var(--pm-t);box-shadow:0 3px 10px rgba(90,65,25,0.13)}
.pm-af-toggle{margin-left:auto;font-size:10px;font-weight:700;padding:4px 11px;border-radius:100px;border:1px solid var(--pm-border);background:#fff;color:var(--pm-t2);cursor:pointer;font-family:inherit;transition:all .14s}
.pm-af-toggle.on,.pm-af-toggle:hover{border-color:var(--pm-ac-bd);color:var(--pm-ac)}
.pm-af-panel{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed var(--pm-border2)}
.pm-af-panel.on{display:block;animation:pmFade .25s ease}
.pm-af-row{margin-bottom:9px}
.pm-af-label{font-family:var(--mono);font-size:8px;letter-spacing:0.16em;text-transform:uppercase;color:var(--pm-t3);margin-bottom:5px}
.pm-af-chip{font-size:10px;font-weight:700;padding:4px 10px;border-radius:100px;border:1px solid var(--pm-border);background:#fff;color:var(--pm-t2);cursor:pointer;font-family:inherit;margin:0 4px 4px 0;transition:all .13s}
.pm-af-chip.on{background:linear-gradient(135deg,var(--pm-ac),var(--pm-ac2));border-color:transparent;color:#fff}
/* Highlights tab */
.pm-hl-card{background:#fff;border:1px solid var(--pm-border);border-radius:14px;padding:12px 13px;margin-bottom:9px}
.pm-hl-card .hc-top{display:flex;align-items:center;gap:9px}
.pm-hl-card .hc-icon{font-size:18px}
.pm-hl-card .hc-title{font-size:12.5px;font-weight:700;color:var(--pm-t)}
.pm-hl-card .hc-body{font-size:11px;color:var(--pm-t2);line-height:1.5;margin-top:5px}
.pm-dist-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:11px}
.pm-dist{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--pm-border);border-radius:12px;padding:8px 10px}
.pm-dist .d-ico{font-size:15px}
.pm-dist .d-l{font-size:10px;color:var(--pm-t3)}
.pm-dist .d-v{font-size:12px;font-weight:700;color:var(--pm-t)}
.pm-mini-photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:11px}
.pm-mini-photo{border-radius:11px;overflow:hidden;aspect-ratio:1;border:1px solid var(--pm-border);position:relative}
.pm-mini-photo svg{position:absolute;inset:0;width:100%;height:100%}
.pm-mini-photo .mp-cap{position:absolute;left:0;right:0;bottom:0;font-size:7.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#fff;background:linear-gradient(transparent,rgba(30,22,10,0.65));padding:10px 6px 4px;text-align:center}

/* View toggle + cinematic */
.pm-view-toggle{position:absolute;top:22px;right:22px;z-index:10;display:flex;gap:3px;background:rgba(255,255,255,0.6);border:1px solid var(--pm-border);border-radius:100px;padding:3px;backdrop-filter:blur(10px)}
.pm-view-btn{font-size:11px;font-weight:700;padding:7px 15px;border-radius:100px;border:none;background:transparent;color:var(--pm-t3);cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px}
.pm-view-btn.on{background:#24211b;color:#fff;box-shadow:0 4px 12px rgba(35,28,15,0.3)}
#pm-cine{position:absolute;inset:0;z-index:8;display:none;overflow:hidden;background:#111}
#pm-cine.on{display:block;animation:pmFade .4s ease}
.pm-cine-inner{position:absolute;inset:-4%;animation:pmKenBurns 22s ease-in-out infinite alternate}
.pm-cine-inner svg{width:100%;height:100%}
@keyframes pmKenBurns{from{transform:scale(1) translateX(0)}to{transform:scale(1.07) translateX(-1.5%)}}
.pm-cine-caption{position:absolute;left:26px;bottom:82px;z-index:6;color:#fff;pointer-events:none}
.pm-cine-caption .cc-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.65)}
.pm-cine-caption .cc-name{font-size:24px;font-weight:600;letter-spacing:-0.02em;margin-top:4px;text-shadow:0 2px 14px rgba(0,0,0,0.4)}
.pm-cine-views{position:absolute;right:22px;bottom:82px;z-index:6;display:flex;gap:8px}
.pm-cine-thumb{width:86px;height:56px;border-radius:11px;overflow:hidden;border:2px solid rgba(255,255,255,0.35);cursor:pointer;position:relative;transition:all .18s;padding:0;background:none}
.pm-cine-thumb:hover{transform:translateY(-3px)}
.pm-cine-thumb.on{border-color:var(--pm-ac2);box-shadow:0 6px 18px rgba(0,0,0,0.35)}
.pm-cine-thumb svg{position:absolute;inset:0;width:100%;height:100%}
.pm-cine-thumb .ct-label{position:absolute;left:0;right:0;bottom:0;font-size:7.5px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,0.7));padding:10px 4px 3px;text-align:center;font-family:"Space Grotesk",sans-serif}

/* More-about button + bottom sheet */
.pm-more-btn{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;z-index:10;display:flex;align-items:center;gap:9px;background:#24211b;color:#fff;border:none;border-radius:100px;padding:12px 22px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 10px 28px rgba(35,28,15,0.35);transition:all .18s}
.pm-more-btn:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 14px 34px rgba(35,28,15,0.45)}
.pm-more-btn .mb-arrow{animation:pmBob 1.8s ease-in-out infinite}
@keyframes pmBob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.pm-sheet{position:absolute;left:0;right:0;bottom:0;z-index:12;height:66%;transform:translateY(102%);transition:transform .45s cubic-bezier(.22,.9,.3,1);display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(242,238,229,0) 0%,rgba(243,239,230,0.88) 9%,rgba(245,241,233,0.97) 20%,#f4f0e7 100%);
  backdrop-filter:blur(6px);border-radius:26px 26px 0 0;pointer-events:none}
.pm-sheet.on{transform:translateY(0);pointer-events:auto}
.pm-sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:26px 26px 4px}
.pm-sheet-title{font-size:19px;font-weight:600;letter-spacing:-0.02em;color:var(--pm-t)}
.pm-sheet-sub{font-size:11.5px;color:var(--pm-t2);margin-top:2px}
.pm-sheet-nav{display:flex;gap:7px;align-items:center}
.pm-sheet-arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--pm-border2);background:#fff;color:var(--pm-t);font-size:14px;cursor:pointer;font-family:inherit;transition:all .14s;display:flex;align-items:center;justify-content:center}
.pm-sheet-arrow:hover{background:#24211b;color:#fff;border-color:#24211b}
.pm-sheet-close{height:38px;padding:0 16px;border-radius:100px;border:1px solid var(--pm-border2);background:#fff;color:var(--pm-t2);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .14s}
.pm-sheet-close:hover{color:var(--pm-red);border-color:rgba(214,69,51,0.4)}
.pm-sheet-track{flex:1;display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;padding:14px 26px 24px;scroll-snap-type:x mandatory;scroll-behavior:smooth}
.pm-sheet-track::-webkit-scrollbar{height:6px}
.pm-mod{flex:0 0 400px;scroll-snap-align:start;background:rgba(255,255,255,0.85);border:1px solid var(--pm-border);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--pm-sh)}
.pm-mod-photo{height:150px;position:relative;flex-shrink:0}
.pm-mod-photo svg{position:absolute;inset:0;width:100%;height:100%}
.pm-mod-tag{position:absolute;top:11px;left:12px;font-family:var(--mono);font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:#fff;background:rgba(25,20,10,0.55);border-radius:100px;padding:4px 10px;backdrop-filter:blur(4px)}
.pm-mod-body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;overflow-y:auto}
.pm-mod-title{font-size:15.5px;font-weight:700;letter-spacing:-0.01em;color:var(--pm-t)}
.pm-mod-text{font-size:11.5px;color:var(--pm-t2);line-height:1.55;margin-top:6px}
.pm-mod-list{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.pm-mod-li{display:flex;align-items:center;gap:9px;background:rgba(40,32,16,0.035);border-radius:11px;padding:8px 10px}
.pm-mod-li .ml-ico{font-size:15px}
.pm-mod-li .ml-t{font-size:11.5px;font-weight:600;color:var(--pm-t)}
.pm-mod-li .ml-s{font-size:10px;color:var(--pm-t3)}
.pm-mod-li .ml-r{margin-left:auto;font-size:11px;font-weight:700;color:var(--pm-ac);white-space:nowrap}
.pm-mod-photos2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pm-mod-photos2 .pm-mini-photo{aspect-ratio:4/3}
.pm-mod-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.pm-mod-stat{background:rgba(40,32,16,0.035);border-radius:12px;padding:10px;text-align:center}
.pm-mod-stat .ms-v{font-size:17px;font-weight:700;letter-spacing:-0.02em;color:var(--pm-ac)}
.pm-mod-stat .ms-l{font-size:8.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--pm-t3);margin-top:3px;font-weight:700}

/* ── Unit deep dive ── */
.pm-unit-wrap{max-width:1340px;margin:0 auto;padding:26px 34px 48px}
.pm-unit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
.pm-back{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--pm-t3);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;padding:0;margin-bottom:12px}
.pm-back:hover{color:var(--pm-ac)}
.pm-unit-title{font-size:31px;font-weight:600;letter-spacing:-0.03em;line-height:1.05;color:var(--pm-t)}
.pm-spec-chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pm-spec-chip{font-size:11px;font-weight:600;color:var(--pm-t2);background:rgba(255,255,255,0.66);border:1px solid var(--pm-border);border-radius:100px;padding:5px 13px}
.pm-ticker{text-align:right;flex-shrink:0}
.pm-ticker .tk-label{font-family:var(--mono);font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--pm-t3)}
.pm-ticker .tk-val{font-size:31px;font-weight:700;letter-spacing:-0.03em;margin-top:3px;transition:color .3s;color:var(--pm-t)}
.pm-ticker .tk-val.bump{color:var(--pm-ac)}
.pm-ticker .tk-delta{font-size:11px;color:var(--pm-t3);margin-top:2px}

function pmLayoutsFor(unit){
  const opts = [
    {key:'open',   name:'Open-plan kitchen', sub:'Kitchen flows into the living space — one bright social room.', delta:0},
    {key:'closed', name:'Closed kitchen',    sub:'Partitioned kitchen with pocket door — cooking smells stay put.', delta:4500},
  ];
  if (unit.beds >= 2) opts.push({key:'study', name:'Study conversion', sub:`Bedroom ${unit.beds} becomes a glazed home office with built-ins.`, delta:2800});
  return opts;
}

const presentSessions = [];

let pmKeyHandler = null;

/* J Portelli demo is trimmed to island → showroom; studio/compare/wrapup steps removed */
const PM_STEPS = [
  {key:'lobby',   label:'Developments'},
  {key:'model',   label:'Showroom'},
];

function pmEuro(n){ return '€' + Math.round(n).toLocaleString(); }
function pmUnitName(u){ return u.beds === 0 ? 'Studio' : `${u.beds}-bed ${u.type}`; }
function pmStatusColor(s){ return s==='available' ? '#e8590c' : s==='hold' ? '#f5a623' : '#b3ab9a'; }

function pmConfigFor(unitId){
  if (!pmState.configs[unitId]) pmState.configs[unitId] = {finish:'oak', layout:'open', addons:[]};
  return pmState.configs[unitId];
}
function pmPriceFor(unit, cfg){
  const fin = PM_FINISHES.find(f=>f.key===cfg.finish) || PM_FINISHES[0];
  const lay = pmLayoutsFor(unit).find(l=>l.key===cfg.layout) || {delta:0};
  const add = cfg.addons.reduce((s,k)=>s + (PM_ADDONS.find(a=>a.key===k)?.price||0), 0);
  return {base:unit.price, finish:fin.deltaSqm*unit.sqm, layout:lay.delta, addons:add,
          total:unit.price + fin.deltaSqm*unit.sqm + lay.delta + add};
}

/* ── Open / exit ── */
function pmOpen(devName){
  pmState = {dev:devName||null, unitId:null, screen:'lobby', oppId:null, contact:null,
             onFileUnits:[], shortlist:[], configs:{}, viewed:[], hidePrices:false, time:'day'};
  pmLobbyF = {beds:0, budgetIdx:0, locs:[], feats:[]};
  document.getElementById('present-mode').classList.add('on');
  document.getElementById('present-mode').classList.remove('pm-hide-prices');
  const pt = document.getElementById('pm-prices-toggle'); if(pt) pt.textContent = 'Prices · on';
  pmUpdateBuyerChip(); pmUpdateShortlistChip();
  pmKeyHandler = (e)=>{ if(e.key==='Escape') pmBack(); };
  document.addEventListener('keydown', pmKeyHandler);
  if (devName) pmEnterDev(devName); else pmGo('lobby');
}
function pmOpenFromOpp(oppId){
  const opp = pipelineCards.find(c=>c.id===oppId);
  pmOpen();
  if (opp){
    pmState.oppId = opp.id;
    pmState.contact = opp.contact;
    pmState.onFileUnits = [...(opp.unitIds||[])];
    pmUpdateBuyerChip();
    pmEnterDev(opp.project);
  }
}
function pmExit(){
  document.getElementById('present-mode').classList.remove('on');
  if (pmKeyHandler){ document.removeEventListener('keydown', pmKeyHandler); pmKeyHandler = null; }
  pmStopLoop();
  if (window.pmIsland && pmIsland.pause) pmIsland.pause();
}
function pmBack(){
  const card = document.getElementById('pm-benefit-card');
  if (card && card.style.display === 'block'){ card.style.display = 'none'; return; }
  const sheet = document.getElementById('pm-sheet');
  if (sheet && sheet.classList.contains('on')){ pmToggleSheet(false); return; }
  /* J Portelli flow: Cinematic is the showroom's front door — Esc goes straight back to the island */
  const s = pmState?.screen;
  if (s==='unit') pmGo('model');
  else if (s==='compare') pmGo(pmState.dev ? 'model' : 'lobby');
  else if (s==='wrapup') pmGo('compare');
  else if (s==='model') pmGo('lobby');
  else pmExit();
}

/* ── Navigation ── */
function pmGo(screen){
  if (screen==='model' && !pmState.dev){ pmGo('lobby'); return; }
  if (screen==='unit' && !pmState.unitId){ pmGo('model'); return; }
  pmState.screen = screen;
  document.querySelectorAll('#present-mode .pm-screen').forEach(el=>el.classList.remove('on'));
  const el = document.getElementById('pms-'+screen);
  if (el) el.classList.add('on');
  pmRenderSteps();
  if (screen==='lobby'){
    pmRenderLobby();
    if (window.pmIsland && pmIsland.resume) pmIsland.resume();
  } else {
    if (window.pmIsland && pmIsland.pause) pmIsland.pause();
  }
  if (screen==='model')   pmActivateModel();
  else pmStopLoop();
  if (screen==='unit')    pmRenderUnit();
  if (screen==='compare') pmRenderCompare();
  if (screen==='wrapup')  pmRenderWrapup();
}
function pmRenderSteps(){
  const reachable = {lobby:true, model:!!pmState.dev, unit:!!pmState.unitId, compare:true, wrapup:true};
  document.getElementById('pm-steps').innerHTML = PM_STEPS.map((s,i)=>{
    const cur = pmState.screen===s.key;
    const cls = cur ? 'cur' : (reachable[s.key] ? 'reachable' : '');
    const click = (!cur && reachable[s.key]) ? `onclick="pmGo('${s.key}')"` : '';
    return `${i? '<span class="pm-step-sep">›</span>':''}<div class="pm-step ${cls}" ${click}><span class="pm-step-n">${i+1}</span>${s.label}</div>`;
  }).join('');
}
function pmUpdateBuyerChip(){
  const chip = document.getElementById('pm-buyer-chip');
  if (!chip) return;
  if (pmState.contact){
    const initials = pmState.contact.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    chip.innerHTML = `<span class="pm-buyer-av">${initials}</span> Presenting to ${pmState.contact}`;
    chip.classList.add('on');
  } else chip.classList.remove('on');
}
function pmUpdateShortlistChip(){
  const c = document.getElementById('pm-shortlist-chip');
  if (c){ c.textContent = `☆ Shortlist · ${pmState.shortlist.length}`; c.classList.toggle('hot', pmState.shortlist.length>0); }
}
function pmTogglePrices(){
  pmState.hidePrices = !pmState.hidePrices;
  document.getElementById('present-mode').classList.toggle('pm-hide-prices', pmState.hidePrices);
  document.getElementById('pm-prices-toggle').textContent = pmState.hidePrices ? 'Prices · hidden' : 'Prices · on';
}

/* ── Lobby ── */
function pmDevHeroSVG(dev){
  const meta = PM_DEV_META[dev] || {hue:200};
  const h = meta.hue;
  const units = allProps.filter(p=>p.dev===dev);
  const floors = Math.max(...units.map(u=>u.floor));
  let bars = '';
  const n = 7, seed = dev.length;
  for (let i=0;i<n;i++){
    const isMain = i===3;
    const bh = isMain ? 40+floors*14 : 34 + ((seed*(i+3))%67);
    const x = 8 + i*42, w = 34;
    const y = 210 - bh;
    bars += `<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="3" fill="${isMain?'#fdfcf8':'hsla(40,16%,76%,0.85)'}" stroke="rgba(60,50,30,${isMain?0.22:0.10})" stroke-width="1"/>`;
    for (let r=0;r<Math.floor(bh/16);r++) for (let c=0;c<3;c++){
      if (((seed+i*7+r*3+c)%5)<3) bars += `<rect x="${x+5+c*10}" y="${y+6+r*16}" width="6" height="8" rx="1" fill="${isMain?'rgba(232,89,12,0.75)':'hsla(38,14%,60%,0.45)'}"/>`;
    }
  }
  return `<svg viewBox="0 0 310 210" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%">
    <defs><linearGradient id="pmsky-${h}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="hsla(${h},34%,90%,1)"/><stop offset="1" stop-color="hsla(40,32%,84%,1)"/>
    </linearGradient></defs>
    <rect width="310" height="210" fill="url(#pmsky-${h})"/>
    <circle cx="252" cy="42" r="17" fill="rgba(245,166,35,0.85)"/>
    <ellipse cx="155" cy="208" rx="150" ry="10" fill="rgba(80,65,35,0.10)"/>
    ${bars}</svg>${PM_DEV_PHOTO[dev] ? pmPhotoImg(PM_DEV_PHOTO[dev]) : ''}`;
}

        }).join('')}

  }

  // Push filter state to the island (or 2D fallback)
  pmUpdateLobbyState(infos, recDev, matchCount);
}

function pmUpdateLobbyState(infos, recDev, matchCount){
  const devs = Object.keys(PM_DEV_META);
  const matchingIds = devs.filter(d=>infos[d].ok).map(d=>pmPresentProjects.find(p=>p.name===d)?.id).filter(Boolean);
  const recId = recDev ? pmPresentProjects.find(p=>p.name===recDev)?.id : null;

  if (window.pmIsland && pmIsland.setFilterResults){
    pmIsland.setFilterResults(matchingIds);

  } else {

    const host = document.getElementById('pm-island-host');

      <div class="pm-map-chip" style="top:18px;left:20px"><span class="dot"></span>LIVE MAP · MALTA — ${matchCount} MATCH${matchCount===1?'':'ES'}</div>
      <div class="pm-map-chip" style="bottom:18px;right:20px">35.9°N 14.4°E · TAP A PIN TO ENTER</div>`;
    }

}

function pmDevMatchInfo(dev){
  const F = pmLobbyF, max = PM_BUDGET_STEPS[F.budgetIdx];
  const loc = allProps.find(u=>u.dev===dev)?.loc || '';

  ) : [];

<script>
/* ═══════════════════════════════════════════════════════════
   PRESENT MODE — 3D showroom (three.js)
════════════════════════════════════════════════════════════ */
let pmThree = null;
let pmThreeLoading = false, pmThreeFailed = false;

/* Offline-first loader: vendored three.js r128 + OrbitControls, CDN as fallback only.
   OrbitControls failing is non-fatal (showroom uses a custom orbit). */
function pmLoadScript(src, ok, fail){
  const s = document.createElement('script');
  s.src = src; s.onload = ok; s.onerror = fail;
  document.head.appendChild(s);
}
function pmEnsureThree(cb){
  if (window.THREE && THREE.OrbitControls){ cb(); return; }
  if (pmThreeFailed){ cb(); return; }
  if (pmThreeLoading){ setTimeout(()=>pmEnsureThree(cb), 120); return; }
  pmThreeLoading = true;
  const done = ()=>{ pmThreeLoading = false; cb(); };
  const fail = ()=>{ pmThreeLoading = false; pmThreeFailed = true; cb(); };
  const loadControls = ()=>{
    if (window.THREE && THREE.OrbitControls){ done(); return; }
    pmLoadScript('../vendor/OrbitControls.js', done,
      ()=>pmLoadScript('https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js', done, done));
  };
  if (window.THREE){ loadControls(); return; }
  pmLoadScript('../vendor/three.min.js', loadControls,
    ()=>pmLoadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', loadControls, fail));
}

function pmActivateModel(){
  pmRenderModelTitle();
  pmRenderRail();
  pmEnsureThree(()=>{
    if (!window.THREE){
      document.getElementById('pm-canvas-wrap').insertAdjacentHTML('beforeend',
        `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4"><div style="text-align:center;color:var(--pm-t3);font-size:12px">3D engine unavailable offline.<br>Pick a unit from the panel on the right →</div></div>`);
      return;
    }
    if (!pmThree) pmInitThree();
    if (pmThree.builtDev !== pmState.dev) pmBuildScene(pmState.dev);
    else {
      // returning from a unit fly-in — ease back out to the full view
      const T = pmThree;
      T.flying = false;
      T.target.set(0, T.dims.H*0.42, 0);
      T.orbit.tRadius = Math.max(T.orbit.tRadius, Math.max(58, T.dims.H*3.1));
      T.orbit.tPhi = Math.min(T.orbit.tPhi, 1.2);
      T.lastInteract = performance.now();
    }
    pmResize();
    if (pmState.view !== 'cine') pmStartLoop(); // don't spin the model loop beneath the cinematic overlay
  });
}

function pmRenderModelTitle(){

/* ── Init ── */
function pmInitThree(){
  const canvas = document.getElementById('pm-canvas');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  pmThree = {
    renderer, canvas,
    scene:null, camera:new THREE.PerspectiveCamera(44, 1.6, 0.1, 600),
    unitMeshes:[], meshByUnit:{}, hotspots:[], builtDev:null,
    orbit:{theta:-0.65, phi:1.12, radius:64, tTheta:-0.65, tPhi:1.12, tRadius:64},
    target:new THREE.Vector3(0,11,0),
    raf:null, lastInteract:0, hovered:null, dims:null, time:'day',
    ray:new THREE.Raycaster(), mouse:new THREE.Vector2(), flying:false,
  };
  pmBindPointer();
  window.addEventListener('resize', pmResize);
}

/* ── Scene build ── */
function pmBuildScene(dev){
  const T = pmThree;
  T.builtDev = dev;
  T.unitMeshes = []; T.meshByUnit = {}; T.hovered = null; T.flying = false;
  const scene = new THREE.Scene();
  T.scene = scene;

  const units = allProps.filter(p=>p.dev===dev);
  const maxFloor = Math.max(...units.map(u=>u.floor));
  const SLOTS = 3, W = 27, D = 15, FH = 3.7, POD = 4.4;
  const H = POD + maxFloor*FH;
  T.dims = {W, D, FH, POD, H, maxFloor};
  T.target.set(0, H*0.42, 0);
  T.orbit.tRadius = Math.max(58, H*3.1); T.orbit.radius = T.orbit.tRadius + 30;
  T.orbit.tTheta = -0.65; T.orbit.tPhi = 1.12;

  // Lights
  T.hemi = new THREE.HemisphereLight(0xffffff, 0xd8cdb4, 1.0);
  scene.add(T.hemi);
  T.sun = new THREE.DirectionalLight(0xffe6c4, 0.95);
  T.sun.position.set(46, 70, 24);
  scene.add(T.sun);

  // Ground + grid + contact shadow
  const ground = new THREE.Mesh(new THREE.CircleGeometry(120, 48), new THREE.MeshLambertMaterial({color:0xece7da}));
  ground.rotation.x = -Math.PI/2; ground.position.y = -0.02; scene.add(ground);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(W*0.85, 40), new THREE.MeshBasicMaterial({color:0xd3c9b2, transparent:true, opacity:0.3}));
  shadow.rotation.x = -Math.PI/2; shadow.position.y = 0.005; scene.add(shadow);
  const grid = new THREE.GridHelper(220, 44, 0xcfc4aa, 0xdcd3bd);
  grid.position.y = 0.01; scene.add(grid);

  const edgeMat = new THREE.LineBasicMaterial({color:0x5c5443, transparent:true, opacity:0.4});
  const addEdges = (mesh)=>{ const e = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), edgeMat); mesh.add(e); };

  // Podium / lobby
  const podium = new THREE.Mesh(new THREE.BoxGeometry(W+3, POD, D+3),
    new THREE.MeshLambertMaterial({color:0xf5f2ea, emissive:0xfff0dc, emissiveIntensity:0.05, transparent:true, opacity:0.98}));
  podium.position.y = POD/2; scene.add(podium); addEdges(podium);
  const door = new THREE.Mesh(new THREE.BoxGeometry(6, POD*0.72, 0.4),
    new THREE.MeshLambertMaterial({color:0xe8590c, emissive:0xe8590c, emissiveIntensity:0.35}));
  door.position.set(0, POD*0.36, (D+3)/2 + 0.05); scene.add(door);

  // Floors: slabs + unit boxes
  const slotW = (W - 1.4)/SLOTS;
  units.sort((a,b)=>a.id.localeCompare(b.id));
  const byFloor = {};
  units.forEach(u=>{ (byFloor[u.floor] = byFloor[u.floor]||[]).push(u); });

  for (let f=1; f<=maxFloor; f++){
    const y0 = POD + (f-1)*FH;
    const slab = new THREE.Mesh(new THREE.BoxGeometry(W+1.6, 0.3, D+1.6), new THREE.MeshLambertMaterial({color:0xe4ded0}));
    slab.position.y = y0 + 0.15; scene.add(slab);
    const isTop = f===maxFloor;
    const inset = isTop ? 2.4 : 0;
    const realUnits = byFloor[f] || [];
    for (let s=0; s<SLOTS; s++){
      const u = realUnits[s];
      const bw = slotW - 0.5 - inset/SLOTS, bh = FH - 0.72, bd = D - 1.2 - inset;
      const x = -W/2 + 0.7 + slotW*s + slotW/2;
      let mat;
      if (u){
        const c = new THREE.Color(pmStatusColor(u.status));
        mat = new THREE.MeshLambertMaterial({color:c.clone().lerp(new THREE.Color(0xffffff), 0.42), emissive:c, emissiveIntensity:0.22, transparent:true, opacity:0.96});
      } else {
        mat = new THREE.MeshLambertMaterial({color:0xfaf8f1, emissive:0xffffff, emissiveIntensity:0.06, transparent:true, opacity:0.97});
      }
      const box = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), mat);
      box.position.set(x, y0 + 0.3 + bh/2 + 0.06, 0);
      scene.add(box); addEdges(box);
      if (u){
        box.userData.unitId = u.id;
        T.unitMeshes.push(box);
        T.meshByUnit[u.id] = box;
      }
    }
  }

  // Roof: parapet + pool + plant room
  const parapet = new THREE.Mesh(new THREE.BoxGeometry(W+1.6, 0.55, D+1.6), new THREE.MeshLambertMaterial({color:0xdcd5c5}));
  parapet.position.y = H + 0.27; scene.add(parapet);
  const pool = new THREE.Mesh(new THREE.BoxGeometry(W*0.34, 0.35, D*0.4),
    new THREE.MeshLambertMaterial({color:0x6fc2dc, emissive:0x9adcf0, emissiveIntensity:0.35}));
  pool.position.set(-W*0.2, H + 0.72, 0); scene.add(pool);
  const plant = new THREE.Mesh(new THREE.BoxGeometry(W*0.22, 1.6, D*0.3), new THREE.MeshLambertMaterial({color:0xe9e3d5}));
  plant.position.set(W*0.26, H + 1.35, -D*0.12); scene.add(plant); addEdges(plant);

  // Context buildings
  const ctxMat = new THREE.MeshLambertMaterial({color:0xdfd9ca, emissive:0xfff0dc, emissiveIntensity:0.03});
  const seed = dev.length;
  for (let i=0;i<9;i++){
    const ang = (i/9)*Math.PI*2 + seed*0.7;
    const dist = 52 + ((seed*13 + i*29)%30);
    const ch = 6 + ((seed*7 + i*17)%18);
    const b = new THREE.Mesh(new THREE.BoxGeometry(10 + (i%3)*4, ch, 9 + ((i+1)%3)*4), ctxMat);
    b.position.set(Math.sin(ang)*dist, ch/2, Math.cos(ang)*dist);
    scene.add(b);
  }

  pmBuildHotspots(dev);
  pmSetTime(pmState.time || 'day');
}

/* ── Hotspots ── */
function pmAnchorPos(anchor){
  const {W, D, H, POD} = pmThree.dims;
  switch(anchor){
    case 'roof':      return new THREE.Vector3(-W*0.2, H + 1.6, 0);
    case 'side-high': return new THREE.Vector3(W/2 + 1.4, H*0.8, D*0.2);
    case 'side-mid':  return new THREE.Vector3(-W/2 - 1.4, H*0.55, -D*0.15);
    case 'ground':    return new THREE.Vector3(W*0.34, 1.6, D/2 + 2.4);
    case 'lobby': default: return new THREE.Vector3(-W*0.2, POD*0.6, D/2 + 2.2);
  }
}
function pmBuildHotspots(dev){

/* ── Time of day ── */
function pmSetTime(t){
  const T = pmThree; if (!T || !T.scene) return;
  pmState.time = t;
  if (t==='day'){
    T.scene.background = new THREE.Color(0xe9e3d4);
    T.scene.fog = new THREE.FogExp2(0xe9e3d4, 0.0028);
    T.hemi.color.set(0xffffff); T.hemi.intensity = 1.0;
    T.sun.color.set(0xffe6c4); T.sun.intensity = 0.95;
  } else {
    T.scene.background = new THREE.Color(0xe6c9a0);
    T.scene.fog = new THREE.FogExp2(0xe6c9a0, 0.0034);
    T.hemi.color.set(0xffd9ae); T.hemi.intensity = 0.72;
    T.sun.color.set(0xff8a3c); T.sun.intensity = 0.95;
  }
  const glow = t==='dusk' ? 1.9 : 1;
  T.scene.traverse(o=>{
    if (o.isMesh && o.material && o.material.emissiveIntensity !== undefined && o.userData._baseEI === undefined)
      o.userData._baseEI = o.material.emissiveIntensity;
    if (o.isMesh && o.material && o.userData._baseEI !== undefined)
      o.material.emissiveIntensity = o.userData._baseEI * glow;
  });
  const btn = document.getElementById('pm-time-toggle');
  if (btn) btn.textContent = t==='day' ? '🌙 Dusk' : '☀️ Day';
}
function pmToggleTime(){ pmSetTime(pmState.time==='day' ? 'dusk' : 'day'); }
function pmResetCamera(){
  const T = pmThree; if (!T) return;
  T.orbit.tTheta = -0.65; T.orbit.tPhi = 1.12;
  T.orbit.tRadius = Math.max(58, T.dims.H*3.1);
  T.lastInteract = performance.now();
}

/* ── Pointer / orbit ── */
function pmIsOverlayEvent(e){
  return !!(e.target && e.target.closest &&
    e.target.closest('.pm-sheet, .pm-more-btn, .pm-view-toggle, .pm-hud-bl, .pm-hotspot, #pm-benefit-card, #pm-cine, .pm-cine-views'));
}
function pmBindPointer(){
  const wrap = document.getElementById('pm-canvas-wrap');
  let down = null, moved = 0;
  wrap.addEventListener('pointerdown', e=>{
    if (pmIsOverlayEvent(e)){ down = null; return; }
    down = {x:e.clientX, y:e.clientY}; moved = 0;
    pmThree.lastInteract = performance.now();
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', e=>{
    const T = pmThree; if (!T) return;
    if (!down && pmIsOverlayEvent(e)){ pmHideTooltip(); return; }
    T.lastInteract = performance.now();
    if (down){
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      moved += Math.abs(dx) + Math.abs(dy);
      T.orbit.tTheta -= dx * 0.0062;
      T.orbit.tPhi   = Math.min(1.46, Math.max(0.22, T.orbit.tPhi - dy * 0.0042));
      down = {x:e.clientX, y:e.clientY};
      pmHideTooltip();
    } else {
      pmHoverRay(e);
    }
  });
  wrap.addEventListener('pointerup', e=>{
    const wasClick = down && moved < 6;
    down = null;
    if (wasClick && pmThree && pmThree.hovered){
      const id = pmThree.hovered.userData.unitId;
      const u = allProps.find(p=>p.id===id);
      if (u && u.status==='sold'){ toast(id + ' is already sold'); return; }
      pmFlyToUnit(id);
    }
  });
  wrap.addEventListener('pointerleave', ()=>{ down=null; pmHideTooltip(); });
  wrap.addEventListener('wheel', e=>{
    const T = pmThree; if (!T) return;
    if (pmIsOverlayEvent(e)) return; // let the sheet / overlays scroll natively
    e.preventDefault();
    T.lastInteract = performance.now();
    T.orbit.tRadius = Math.min(150, Math.max(24, T.orbit.tRadius * (1 + e.deltaY*0.0011)));
  }, {passive:false});
}
function pmHoverRay(e){
  const T = pmThree; if (!T || !T.scene || T.flying) return;
  const rect = T.canvas.getBoundingClientRect();
  T.mouse.x = ((e.clientX - rect.left)/rect.width)*2 - 1;
  T.mouse.y = -((e.clientY - rect.top)/rect.height)*2 + 1;
  T.ray.setFromCamera(T.mouse, T.camera);
  const hits = T.ray.intersectObjects(T.unitMeshes, false);
  const hit = hits[0] ? hits[0].object : null;
  if (T.hovered && T.hovered !== hit){
    T.hovered.material.emissiveIntensity = T.hovered.userData._baseEI ?? 0.22;
    pmRailHighlight(null);
  }
  T.hovered = hit;
  const wrap = document.getElementById('pm-canvas-wrap');
  wrap.style.cursor = hit ? 'pointer' : 'grab';
  if (hit){
    hit.material.emissiveIntensity = 0.75;
    const u = allProps.find(p=>p.id===hit.userData.unitId);
    if (u) pmShowTooltip(u, e.clientX - rect.left, e.clientY - rect.top);
    pmRailHighlight(hit.userData.unitId);
  } else pmHideTooltip();
}
function pmShowTooltip(u, x, y){
  const tt = document.getElementById('pm-tooltip');
  const wrap = document.getElementById('pm-canvas-wrap');
  const statusTxt = u.status==='available' ? 'Available' : u.status==='hold' ? 'On hold' : 'Sold';
  tt.innerHTML = `<div class="tt-id">${u.id} · FLOOR ${u.floor}</div>
    <div class="tt-name">${pmUnitName(u)}</div>
    <div class="tt-row"><span>${u.beds===0?'Studio':u.beds+' bed'} · ${u.baths} bath</span><span>${u.sqm} sqm${u.ext?` +${u.ext} ext`:''}</span></div>
    <div class="tt-row"><span style="color:${pmStatusColor(u.status)}">● ${statusTxt}</span><span>Ready ${u.ready}</span></div>
    <div class="tt-price pm-price">${pmEuro(u.price)}</div>
    ${u.status!=='sold' ? '<div class="tt-cta">Click to step inside →</div>' : ''}`;
  tt.style.display = 'block';
  const maxX = wrap.clientWidth - 210, maxY = wrap.clientHeight - 150;
  tt.style.left = Math.min(x + 18, maxX) + 'px';
  tt.style.top  = Math.min(y + 14, maxY) + 'px';
}
function pmHideTooltip(){
  const tt = document.getElementById('pm-tooltip');
  if (tt) tt.style.display = 'none';
  const T = pmThree;
  if (T && T.hovered){ T.hovered.material.emissiveIntensity = T.hovered.userData._baseEI ?? 0.22; T.hovered = null; pmRailHighlight(null); }
}
function pmFlyToUnit(unitId){
  const T = pmThree;
  const mesh = T.meshByUnit[unitId];
  pmHideTooltip();
  if (!mesh){ pmOpenUnit(unitId); return; }
  T.flying = true;
  T.orbit.tRadius = 26;
  T.orbit.tPhi = 1.28;
  T.target.copy(mesh.position);
  setTimeout(()=>{ T.flying = false; T.target.set(0, T.dims.H*0.42, 0); pmOpenUnit(unitId); }, 620);
}

/* ── Render loop ── */
function pmStartLoop(){
  if (!pmThree || pmThree.raf) return;
  const tick = ()=>{
    const T = pmThree;
    if (!T){ return; }
    T.raf = requestAnimationFrame(tick);
    if (!T.scene) return;
    // idle auto-rotate
    if (performance.now() - T.lastInteract > 5000 && !T.flying) T.orbit.tTheta += 0.0015;
    const o = T.orbit;
    o.theta += (o.tTheta - o.theta)*0.085;
    o.phi   += (o.tPhi   - o.phi  )*0.085;
    o.radius+= (o.tRadius- o.radius)*0.085;
    const cam = T.camera;
    cam.position.set(
      T.target.x + o.radius*Math.sin(o.phi)*Math.sin(o.theta),
      T.target.y + o.radius*Math.cos(o.phi),
      T.target.z + o.radius*Math.sin(o.phi)*Math.cos(o.theta)
    );
    cam.lookAt(T.target);
    // hotspot projection
    const wrap = document.getElementById('pm-canvas-wrap');
    const w = wrap.clientWidth, h = wrap.clientHeight;
    T.hotspots.forEach(hs=>{
      const v = hs.pos.clone().project(cam);
      if (v.z > 1){ hs.el.style.display = 'none'; return; }
      hs.el.style.display = 'flex';
      hs.el.style.left = ((v.x*0.5+0.5)*w) + 'px';
      hs.el.style.top  = ((-v.y*0.5+0.5)*h) + 'px';
    });
    T.renderer.render(T.scene, cam);
  };
  tick();
}
function pmStopLoop(){
  if (pmThree && pmThree.raf){ cancelAnimationFrame(pmThree.raf); pmThree.raf = null; }
}
function pmResize(){
  const T = pmThree; if (!T) return;
  const wrap = document.getElementById('pm-canvas-wrap');
  if (!wrap || !wrap.clientWidth) return;
  T.renderer.setSize(wrap.clientWidth, wrap.clientHeight, false);
  T.camera.aspect = wrap.clientWidth / wrap.clientHeight;
  T.camera.updateProjectionMatrix();
}

/* ── Floor plan generator ── */
function pmPlanRooms(unit, cfg){
  const beds = unit.beds, open = cfg.layout==='open', study = cfg.layout==='study';
  const R = [];
  if (beds===0){
    R.push({x:0,y:0,w:350,h:320,label:'Living · Sleeping',kind:'living',island:open});

    if (open) R.push({x:0,y:0,w:300,h:320,label:'Living · Kitchen',kind:'living',island:true});
    else { R.push({x:0,y:0,w:300,h:190,label:'Living',kind:'living'}); R.push({x:0,y:190,w:300,h:130,label:'Kitchen',kind:'kitchen'}); }

    R.push({x:300,y:135,w:240,h:110,label:study?'Study':'Bedroom 2',kind:study?'study':'bed'});

  } else {
    if (open) R.push({x:0,y:0,w:300,h:230,label:'Living · Kitchen',kind:'living',island:true});

function pmRoomFill(kind, fin){
  switch(kind){
    case 'living':  return `${fin.floor}66`;
    case 'kitchen': return `${fin.accent}59`;
    case 'bed':     return `${fin.floor}42`;
    case 'study':   return `${fin.accent}45`;
    case 'bath':    return '#7fb2c95c';
    default:        return 'rgba(60,50,30,0.06)';
  }
}
function pmPlanSVG(unit, cfg, compact){
  const fin = PM_FINISHES.find(f=>f.key===cfg.finish) || PM_FINISHES[0];
  const rooms = pmPlanRooms(unit, cfg);
  const totalArea = rooms.reduce((s,r)=>s + r.w*r.h, 0);
  const OX = 30, OY = 30;
  const widthM = Math.max(6, Math.round(Math.sqrt(unit.sqm*1.7)));
  const depthM = (unit.sqm/widthM).toFixed(1);
  let svg = '';
  rooms.forEach(r=>{
    const sqm = Math.max(3, Math.round(unit.sqm * (r.w*r.h)/totalArea));
    svg += `<g class="pm-room"><title>${r.label} · ~${sqm} sqm</title>
      <rect x="${OX+r.x}" y="${OY+r.y}" width="${r.w}" height="${r.h}" fill="${pmRoomFill(r.kind,fin)}" stroke="rgba(52,45,30,0.55)" stroke-width="2"/>
      <text x="${OX+r.x+12}" y="${OY+r.y+24}" font-size="${compact?15:13.5}" font-weight="600" fill="rgba(35,30,20,0.92)" font-family="Space Grotesk,sans-serif">${r.label}</text>
      <text x="${OX+r.x+12}" y="${OY+r.y+41}" font-size="10.5" fill="rgba(35,30,20,0.45)" font-family="IBM Plex Mono,monospace">~${sqm} sqm</text>
      ${r.island ? `<rect x="${OX+r.x+18}" y="${OY+r.y+r.h-52}" width="86" height="30" rx="4" fill="${fin.accent}dd" stroke="rgba(52,45,30,0.4)" stroke-width="1.4"/><text x="${OX+r.x+26}" y="${OY+r.y+r.h-33}" font-size="9.5" fill="rgba(255,255,255,0.9)" font-family="IBM Plex Mono,monospace">ISLAND</text>` : ''}
    </g>`;
  });
  // terrace
  let terrace = '';
  if (unit.ext > 0){
    terrace = `<g class="pm-room"><title>Terrace · ${unit.ext} sqm</title>
      <rect x="${OX}" y="${OY+330}" width="540" height="46" fill="rgba(232,89,12,0.08)" stroke="rgba(232,89,12,0.6)" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="${OX+12}" y="${OY+358}" font-size="12.5" font-weight="600" fill="rgba(210,80,15,0.95)" font-family="Space Grotesk,sans-serif">Terrace · ${unit.ext} sqm</text></g>`;
  }
  const dims = compact ? '' : `
    <line x1="${OX}" y1="16" x2="${OX+540}" y2="16" stroke="rgba(52,45,30,0.3)" stroke-width="1"/>
    <text x="${OX+262}" y="12" font-size="10" fill="rgba(52,45,30,0.5)" font-family="IBM Plex Mono,monospace">${widthM}.0 m</text>
    <line x1="14" y1="${OY}" x2="14" y2="${OY+320}" stroke="rgba(52,45,30,0.3)" stroke-width="1"/>
    <text x="10" y="${OY+165}" font-size="10" fill="rgba(52,45,30,0.5)" font-family="IBM Plex Mono,monospace" transform="rotate(-90 10 ${OY+165})">${depthM} m</text>
    <circle cx="556" cy="20" r="9" fill="none" stroke="rgba(52,45,30,0.35)"/><text x="553" y="24" font-size="10" fill="rgba(52,45,30,0.6)" font-family="IBM Plex Mono,monospace">N</text>`;
  const vh = unit.ext>0 ? 396 : 366;
  return `<svg viewBox="0 0 600 ${vh}" xmlns="http://www.w3.org/2000/svg">
    <rect x="${OX-4}" y="${OY-4}" width="548" height="328" fill="none" stroke="rgba(38,32,20,0.9)" stroke-width="4"/>
    ${svg}${terrace}${dims}</svg>`;
}

              <span class="pm-addon-check">✓</span>

}
function pmApplyConfig(){
  const u = allProps.find(p=>p.id===pmState.unitId);
  const cfg = pmConfigFor(u.id);
  const fin = PM_FINISHES.find(f=>f.key===cfg.finish);
  const lay = pmLayoutsFor(u).find(l=>l.key===cfg.layout);
  const price = pmPriceFor(u, cfg);
  document.getElementById('pm-plan-box').innerHTML = pmPlanSVG(u, cfg, false);
  const holder = document.getElementById('pm-render-holder');
  const existing = document.getElementById('pm-render-scene');
  if (!existing){ holder.innerHTML = pmRenderSceneHTML(u, cfg); }
  else {
    const ex = PM_FINISH_EXTRA[fin.key];
    existing.style.setProperty('--f', fin.floor); existing.style.setProperty('--fd', ex.floorD);
    existing.style.setProperty('--w', fin.wall);  existing.style.setProperty('--a', fin.accent);
    existing.style.setProperty('--s1', fin.sky[0]); existing.style.setProperty('--s2', fin.sky[1]);
    const island = document.getElementById('pm-rs-island');
    if (island) island.style.display = (cfg.layout==='open' || (u.beds===0 && cfg.layout!=='closed')) ? 'block' : 'none';
    const furn = document.getElementById('pm-rs-furn');
    if (furn) furn.style.display = cfg.addons.includes('furn') ? 'block' : 'none';
    const ph = document.getElementById('pm-rs-photo');
    if (ph){ const f = PM_ASSET + (PM_FINISH_PHOTO[cfg.finish]||'render-oak.jpg'); if (!ph.src.endsWith(f)) ph.src = f; }
    const tint = document.getElementById('pm-rs-tint');
    if (tint) tint.style.background = `linear-gradient(180deg, transparent 55%, ${fin.accent}33 100%)`;
  }
  document.getElementById('pm-rf-name').textContent = `${fin.name} · ${lay.name}`;
  document.getElementById('pm-rf-sub').textContent = cfg.addons.length ? `With ${cfg.addons.map(k=>PM_ADDONS.find(a=>a.key===k).name.toLowerCase()).join(', ')}` : 'Base specification';
  document.getElementById('pm-plan-note').textContent = `${lay.name}${u.ext?` · terrace ${u.ext} sqm`:''}`;
  // ticker
  const tv = document.getElementById('pm-ticker-val');
  tv.textContent = pmEuro(price.total);
  tv.classList.remove('bump'); void tv.offsetWidth; tv.classList.add('bump');
  const extras = price.finish + price.layout + price.addons;
  document.getElementById('pm-ticker-delta').textContent = extras ? `${pmEuro(price.base)} base + ${pmEuro(extras)} personalisation` : 'Base specification';
  // summary rows
  document.getElementById('pm-sum-rows').innerHTML = [
    ['Base price', pmEuro(price.base)],
    [fin.name, price.finish? '+'+pmEuro(price.finish) : 'Included'],
    [lay.name, price.layout? '+'+pmEuro(price.layout) : 'Included'],
    ...cfg.addons.map(k=>{const a=PM_ADDONS.find(x=>x.key===k); return [a.name, '+'+pmEuro(a.price)];}),
  ].map(([l,v])=>`<div class="pm-sum-row pm-price"><span>${l}</span><b>${v}</b></div>`).join('');
  document.getElementById('pm-sum-total').textContent = pmEuro(price.total);
  // selection states
  document.querySelectorAll('#pm-cz-finishes .pm-finish').forEach(el=>el.classList.toggle('on', el.dataset.k===cfg.finish));
  document.querySelectorAll('#pm-cz-layouts .pm-layout-opt').forEach(el=>el.classList.toggle('on', el.dataset.k===cfg.layout));
  document.querySelectorAll('#pm-cz-addons .pm-addon').forEach(el=>el.classList.toggle('on', cfg.addons.includes(el.dataset.k)));
  // shortlist sync (live update if already shortlisted)
  const sl = pmState.shortlist.find(s=>s.unitId===u.id);
  if (sl){ sl.config = {...cfg, addons:[...cfg.addons]}; sl.total = price.total; }
}
function pmSetFinish(k){ pmConfigFor(pmState.unitId).finish = k; pmApplyConfig(); }
function pmSetLayout(k){ pmConfigFor(pmState.unitId).layout = k; pmApplyConfig(); }
function pmToggleAddon(k){
  const cfg = pmConfigFor(pmState.unitId);
  const i = cfg.addons.indexOf(k);
  if (i>=0) cfg.addons.splice(i,1); else cfg.addons.push(k);
  pmApplyConfig();
}
function pmToggleShortlist(){
  const u = allProps.find(p=>p.id===pmState.unitId);
  const cfg = pmConfigFor(u.id);
  const price = pmPriceFor(u, cfg);
  const existing = pmState.shortlist.find(s=>s.unitId===u.id);
  if (existing){
    existing.config = {...cfg, addons:[...cfg.addons]}; existing.total = price.total;
    toast(`${u.id} configuration updated on shortlist`);
  } else {
    pmState.shortlist.push({unitId:u.id, dev:u.dev, config:{...cfg, addons:[...cfg.addons]}, total:price.total});
    toast(`${u.id} added to ${pmState.contact ? pmState.contact.split(' ')[0]+'’s' : 'the'} shortlist`);
    const btn = document.getElementById('pm-sl-btn');
    if (btn) btn.textContent = '✓ Shortlisted — update config';
  }
  pmUpdateShortlistChip();
}

/* ── Compare ── */

}
function pmRenderCompare(){

            <div class="pm-cmp-row"><span>Packs</span><b>${s.config.addons.length ? s.config.addons.map(k=>PM_ADDONS.find(a=>a.key===k).icon).join(' ') : '—'}</b></div>
            <div class="pm-sum-total pm-price" style="margin-top:auto"><span class="st-l">Configured total</span><span class="st-v" style="font-size:18px">${pmEuro(s.total)}</span></div>
            <div style="display:flex;gap:8px;margin-top:6px">

              <button class="pm-btn pm-ghost" style="padding:9px 12px;color:var(--pm-t3)" onclick="pmRemoveShortlist('${s.unitId}')">✕</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:10px;margin-top:30px">
      <button class="pm-btn" onclick="pmGo('${pmState.dev?'model':'lobby'}')">← Keep exploring</button>
      <button class="pm-btn pm-primary" onclick="pmGo('wrapup')">Save & send to buyer →</button>
    </div>`
    : `<div class="pm-empty">Nothing shortlisted yet.<br><br><button class="pm-btn pm-primary" onclick="pmGo('${pmState.dev?'model':'lobby'}')">← Back to the showroom</button></div>`}
  </div>`;

/* ── Wrap-up ── */
function pmRenderWrapup(){
  const sl = pmState.shortlist;
  const devs = [...new Set(sl.map(s=>s.dev).concat(pmState.dev?[pmState.dev]:[]))];
  const totalVal = sl.reduce((s,x)=>s+x.total,0);
  const oppOptions = pipelineCards
    .filter(c=>!['closed_won','closed_lost'].includes(c.stage))
    .map(c=>`<option value="${c.id}" ${c.id===pmState.oppId?'selected':''}>${c.id} · ${c.contact} · ${c.project}</option>`).join('');
  document.getElementById('pms-wrapup').innerHTML = `
  <div class="pm-wrapup-wrap">
    <div class="pm-eyebrow">Wrap up the session</div>
    <h1 class="pm-h1" style="font-size:30px">Save it to their file.<br>Send it to their phone.</h1>
    <p class="pm-sub">Everything ${pmState.contact ? pmState.contact.split(' ')[0] : 'the buyer'} explored today — units, configurations and pricing — packaged as a branded, personalised follow-up.</p>
    <div class="pm-wrap-grid">

        <div class="pm-cz-title">Session summary</div>

        <div class="pm-sum-row"><span>Units explored</span><b>${pmState.viewed.length}</b></div>
        <div class="pm-sum-row"><span>Shortlisted</span><b>${sl.length}</b></div>

        <div style="border-top:1px solid var(--pm-border);margin:12px 0;padding-top:12px">
          ${sl.length ? sl.map(s=>{
            const u = allProps.find(p=>p.id===s.unitId);
            const fin = PM_FINISHES.find(f=>f.key===s.config.finish);
            return `<div class="pm-unit-row" style="cursor:default">
              <span class="pm-unit-dot" style="background:var(--pm-ac)"></span>
              <div class="pm-unit-main">
                <div class="pm-unit-id">${u.id} · ${u.dev}</div>
                <div class="pm-unit-name">${pmUnitName(u)} · ${fin.name}</div>
              </div>
              <div class="pm-unit-price pm-price">${pmEuro(s.total)}</div>
            </div>`;
          }).join('') : '<div style="font-size:12px;color:var(--pm-t3);padding:6px 0">No units shortlisted — the session summary will still be saved.</div>'}
        </div>
        <div class="pm-cz-title" style="margin-top:4px">Session note (goes on the opportunity)</div>
        <textarea id="pm-session-note" class="pm-sel" rows="3" style="resize:vertical" placeholder="e.g. Loved the terrace on the maisonette — wants finance options for the penthouse…"></textarea>
      </div>
      <div class="pm-card" style="padding:20px 22px">
        <div class="pm-cz-title">Associate with opportunity</div>
        <select class="pm-sel" id="pm-opp-select">
          ${pmState.oppId ? '' : '<option value="">Select an opportunity…</option>'}
          ${oppOptions}
          <option value="__new">＋ Create new opportunity${pmState.contact? ' for '+pmState.contact : ''}</option>
        </select>
        <div style="display:flex;flex-direction:column;gap:9px;margin-top:14px">
          <button class="pm-btn pm-primary" onclick="pmSaveSession()">💾 Save session to opportunity</button>
          <button class="pm-btn" onclick="pmGenLink()">🔗 Generate branded buyer link</button>
          <button class="pm-btn" onclick="pmGenBrochure()">📄 Generate personalised brochure</button>
        </div>
        <div class="pm-link-card" id="pm-link-card">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
            <div style="font-size:12px;font-weight:700">✨ ${pmState.contact ? pmState.contact.split(' ')[0]+'’s' : 'Buyer'} personal microsite</div>
            <button class="pm-chip-btn" onclick="pmCopyLink()">Copy</button>
          </div>
          <div class="pm-link-url" id="pm-link-url"></div>
          <div style="font-size:10.5px;color:var(--pm-t3);margin-top:7px">Branded to your agency · shows their shortlisted units, live configurations, floor plans and payment plans. Views are tracked back to the opportunity.</div>

function pmResolveOpp(){
  const sel = document.getElementById('pm-opp-select');
  const val = sel ? sel.value : pmState.oppId;
  if (!val){ toast('Choose an opportunity first'); return null; }
  if (val === '__new'){
    const u0 = pmState.shortlist[0] ? allProps.find(p=>p.id===pmState.shortlist[0].unitId) : null;
    const newOpp = {
      id:'OPP-'+(1050 + presentSessions.length + pipelineCards.length),
      contact: pmState.contact || 'Walk-in buyer', email:'', phone:'', owner:'Sam Urpani',
      project: pmState.dev || (u0? u0.dev : ''), unit: u0? u0.id : '', unitIds: pmState.shortlist.map(s=>s.unitId),
      source:'Showroom presentation', score:70, offer: pmState.shortlist[0]?.total || (u0? u0.price : 0),
      stage:'qualified', nextStep:'Follow up on presented shortlist', lifecycle:'active', daysInStage:0,
      paymentPlan:'10/20/70', deposit:'—', priceException:false,
      holdApproval:'Not requested', reservationApproval:'Not requested', activity:[],
    };
    pipelineCards.unshift(newOpp);
    if (sel){
      sel.insertAdjacentHTML('afterbegin', `<option value="${newOpp.id}" selected>${newOpp.id} · ${newOpp.contact} · ${newOpp.project}</option>`);
      sel.value = newOpp.id;
    }
    toast(`New opportunity ${newOpp.id} created`);
    return newOpp;
  }
  return pipelineCards.find(c=>c.id===val) || null;
}
function pmExtFor(oppId){
  if (!oppExtData[oppId]) oppExtData[oppId] = {notes:[],reminders:[],tasks:[],files:[],docChecklist:[],marketingLinks:[],bids:[],contract:null};
  const ext = oppExtData[oppId];
  ext.files = ext.files || []; ext.marketingLinks = ext.marketingLinks || []; ext.notes = ext.notes || [];
  return ext;
}
function pmSaveSession(){
  const opp = pmResolveOpp(); if (!opp) return;
  const note = document.getElementById('pm-session-note')?.value.trim();
  const session = {
    id:'PS-'+String(1000 + presentSessions.length + 1),
    oppId:opp.id, contact:opp.contact, dev:pmState.dev,
    unitsViewed:[...pmState.viewed],
    shortlist:pmState.shortlist.map(s=>({...s, config:{...s.config, addons:[...s.config.addons]}})),
    note: note || '', link: pmState.link || null, savedAt:'Today',
  };
  presentSessions.push(session);
  pmState.savedOppId = opp.id;
  // enrich the opportunity
  pmState.shortlist.forEach(s=>{ if (!(opp.unitIds||[]).includes(s.unitId)) (opp.unitIds = opp.unitIds||[]).push(s.unitId); });
  const n = pmState.shortlist.length;
  opp.activity = opp.activity || [];
  opp.activity.unshift({t:'Just now', v:`Present session saved — ${pmState.viewed.length} unit(s) explored, ${n} shortlisted with custom configurations${note? ' · “'+note+'”':''}`});
  const ext = pmExtFor(opp.id);
  ext.files.unshift({name:`Present_Session_${(pmState.dev||'Portfolio').replace(/\s+/g,'_')}.pdf`, type:'Brochure', size:'6.4 MB', date:'Today', icon:'✨'});
  if (note) ext.notes.unshift({author:'Sam Urpani', av:'SU', color:'var(--accent)', time:'Just now', text:`[Present session] ${note}`, internal:false});
  const banner = document.getElementById('pm-done-banner');
  banner.innerHTML = `✅ Session <b>${session.id}</b> saved to <b>${opp.id} · ${opp.contact}</b> — shortlist, configurations and the session pack are now on the opportunity file.`;
  banner.classList.add('on');
  const fb = document.getElementById('pm-finish-btn');
  if (fb) fb.textContent = 'Finish & open opportunity →';
  toast('Session saved to ' + opp.id);
}
function pmGenLink(){
  const slug = (pmState.dev || 'portfolio').toLowerCase().replace(/\s+/g,'-');
  const who = (pmState.contact || 'guest').toLowerCase().split(' ')[0];
  pmState.link = `bricly.link/p/${slug}-${who}-${Math.random().toString(36).slice(2,6)}`;
  document.getElementById('pm-link-url').textContent = 'https://' + pmState.link;
  document.getElementById('pm-link-card').classList.add('on');
  if (pmState.savedOppId){
    pmExtFor(pmState.savedOppId).marketingLinks.unshift({label:'Personal Presentation', url:'#', icon:'✨', sub:pmState.link});
  }
  toast('Branded buyer link generated');
}
function pmCopyLink(){
  if (navigator.clipboard && pmState.link) navigator.clipboard.writeText('https://'+pmState.link).catch(()=>{});
  toast('Link copied — paste it into WhatsApp or email');
}
function pmGenBrochure(){
  const banner = document.getElementById('pm-done-banner');
  banner.innerHTML = (banner.classList.contains('on') ? banner.innerHTML + '<br>' : '') +
    `📄 Personalised brochure queued in <b>Studio fulfilment</b> — ${pmState.shortlist.length || 'all viewed'} unit(s) with chosen finishes, floor plans and payment plans. Delivery within 24h.`;
  banner.classList.add('on');
  if (pmState.savedOppId){
    pmExtFor(pmState.savedOppId).files.unshift({name:`${(pmState.contact||'Buyer').split(' ')[0]}_Personal_Brochure.pdf`, type:'Brochure', size:'12.1 MB', date:'Today', icon:'📄'});
  }
  toast('Brochure request sent to Studio');
}
function pmFinish(){
  const saved = pmState.savedOppId;
  pmExit();
  if (saved){
    activeOppId = saved;
    go('opp-detail');
    toast('Presentation saved — you’re on the opportunity file');
  }
}
</script>
