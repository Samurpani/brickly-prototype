<script>
/* ═══════════════════════════════════════════════════════════
   pmIsland — 3D interactive island of Malta for Stage 1 lobby
   ═══════════════════════════════════════════════════════════ */
const pmIsland = (function(){
  let state = {
    container: null, scene: null, camera: null, renderer: null, controls: null,
    projects: [], pins: [], labels: [], labelEls: [],
    matchingIds: [], recommendedId: null, hoveredId: null,
    raf: null, paused: false, lastInteract: 0, selectedCallback: null,
    raycaster: null, mouse: null, island: null, sea: null, fog: null,
    idleTimer: null, labelContainer: null
  };

  // Lat/lng → scene coords (local equirectangular)
  function pmProjectLatLng(lat, lng){
    const lat0 = 35.94, lng0 = 14.38, S = 300;
    const x = (lng - lng0) * Math.cos(lat0 * Math.PI / 180) * S;
    const z = -(lat - lat0) * S;
    return {x, z};
  }

  // Create radial gradient texture for sea
  function createSeaTexture(){
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(256,256,0, 256,256,256);
    grad.addColorStop(0, '#16222f');
    grad.addColorStop(1, '#0a0e14');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,512,512);
    return new THREE.CanvasTexture(canvas);
  }

  // Create glow sprite texture
  function createGlowTexture(){
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(32,32,0, 32,32,32);
    grad.addColorStop(0, 'rgba(255,230,0,1)');
    grad.addColorStop(0.4, 'rgba(255,230,0,0.4)');
    grad.addColorStop(1, 'rgba(255,230,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(canvas);
  }

  function init(containerEl, projects, opts){
    state.container = containerEl;
    state.projects = projects;
    state.raycaster = new THREE.Raycaster();
    state.mouse = new THREE.Vector2();

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c0b0a);
    state.fog = new THREE.Fog(0x0c0b0a, 250, 500);
    scene.fog = state.fog;
    state.scene = scene;

    // Camera — frame the archipelago based on the panel's aspect ratio
    const camera = new THREE.PerspectiveCamera(40, containerEl.clientWidth / containerEl.clientHeight, 1, 800);
    (function frameIsland(){
      const aspect = camera.aspect || 1.6;
      const vHalf = THREE.MathUtils.degToRad(20);                 // half of 40° vertical fov
      const hHalf = Math.atan(Math.tan(vHalf) * aspect);          // half horizontal fov
      const distW = 68 / Math.tan(hHalf);                         // fit island half-diagonal (~64) + margin — safe at all orbit azimuths
      const distH = 96;                                           // fit foreshortened depth vertically
      const dist  = Math.min(Math.max(distW, distH), 235);
      const el = THREE.MathUtils.degToRad(42);                    // elevation
      const horiz = dist * Math.cos(el);
      camera.position.set(horiz * 0.26, dist * Math.sin(el), horiz * 0.97);
    })();
    state.camera = camera;

    // Renderer
    const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(containerEl.clientWidth, containerEl.clientHeight);
    containerEl.appendChild(renderer.domElement);
    state.renderer = renderer;

    // Lights
    const hemi = new THREE.HemisphereLight(0x8fa3b8, 0x2a2620, 0.9);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffb35c, 1.15);
    sun.position.set(100, 30, 80);
    scene.add(sun);
    const amb = new THREE.AmbientLight(0x3a362e, 0.5);
    scene.add(amb);

    // Sea
    const seaGeo = new THREE.CircleGeometry(450, 64);
    const seaMat = new THREE.MeshBasicMaterial({map:createSeaTexture(), side:THREE.FrontSide});
    const sea = new THREE.Mesh(seaGeo, seaMat);
    sea.rotation.x = -Math.PI / 2;
    sea.position.y = -0.5;
    scene.add(sea);
    state.sea = sea;

    // Island from GeoJSON
    buildIsland(scene);

    // Label overlay (must be created before buildPins which appends to it)
    const labelContainer = document.createElement('div');
    labelContainer.id = 'pm-island-labels';
    containerEl.appendChild(labelContainer);
    state.labelContainer = labelContainer;

    // Pins
    buildPins(scene, projects);

    // OrbitControls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 22;
    controls.maxDistance = 240;
    controls.minPolarAngle = Math.PI * 0.14; // ~25° from vertical
    controls.maxPolarAngle = Math.PI * 0.36; // ~65° from vertical — never below the horizon
    controls.target.set(0, -6, -2); // slightly below sea level — biases the island up-screen so the near edge never clips
    controls.autoRotate = true;            // attract mode from the first frame
    controls.autoRotateSpeed = 0.85;       // ≈ 70s per revolution
    state.controls = controls;
    state.homePos = camera.position.clone();      // framed overview — restored after each fly-to handoff
    state.homeTarget = controls.target.clone();

    // HUD chips
    const hudTL = document.createElement('div');
    hudTL.className = 'pm-isl-hud';
    hudTL.style.cssText = 'top:18px;left:20px';
    hudTL.innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:#FFE600;display:inline-block;margin-right:8px;animation:pmBlink 1.4s infinite"></span>LIVE ISLAND · MALTA';
    containerEl.appendChild(hudTL);

    const hudBR = document.createElement('div');
    hudBR.className = 'pm-isl-hud';
    hudBR.style.cssText = 'bottom:18px;right:20px';
    hudBR.textContent = '35.9°N 14.4°E · DRAG TO ORBIT';
    containerEl.appendChild(hudBR);

    // Pointer events
    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    renderer.domElement.addEventListener('wheel', resetIdleTimer, {passive:true});

    // Resize handling: window resize AND container layout changes (flex settles after init)
    window.addEventListener('resize', resize);
    state.resizeObs = new ResizeObserver(()=>resize());
    state.resizeObs.observe(containerEl);

    // Start render loop (attract mode already on — idle timer only arms after input)
    state.paused = false;
    refreshLabelContent();
    animate();
  }

  function buildIsland(scene){
    const shapes = [];
    pmMaltaGeo.coordinates.forEach(polygon=>{
      polygon.forEach(ring=>{
        const shape = new THREE.Shape();
        ring.forEach((coord,i)=>{
          const {x,z} = pmProjectLatLng(coord[1], coord[0]);
          if (i===0) shape.moveTo(x, z);
          else shape.lineTo(x, z);
        });
        shapes.push(shape);
      });
    });

    const extrudeSettings = {
      depth: 1.6,
      bevelEnabled: true,
      bevelThickness: 0.25,
      bevelSize: 0.25,
      bevelSegments: 1,
      curveSegments: 2
    };

    const topMat = new THREE.MeshStandardMaterial({color:0x55503f, roughness:0.9, metalness:0}); // warm limestone — legible against the dark sea
    const sideMat = new THREE.MeshStandardMaterial({color:0x6b6252, roughness:0.88, metalness:0, emissive:0x3a352c, emissiveIntensity:0.25});

    shapes.forEach(shape=>{
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.rotateX(Math.PI / 2);
      geo.translate(0, 1.6, 0); // extrusion points down after rotate — lift so the top face sits at y=1.6, well above the sea
      const mesh = new THREE.Mesh(geo, [topMat, sideMat]);
      mesh.name = 'island';
      scene.add(mesh);
      if (!state.island) state.island = mesh;
    });
  }

  function buildPins(scene, projects){
    const glowTex = createGlowTexture();
    projects.forEach(prj=>{
      const {x,z} = pmProjectLatLng(prj.lat, prj.lng);
      const group = new THREE.Group();
      group.position.set(x, 1.6, z);
      group.userData = {projectId: prj.id, projectName: prj.name};

      // Stem
      const stemGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.2, 8);
      const stemMat = new THREE.MeshStandardMaterial({color:0x4a4238, roughness:0.7, metalness:0.2});
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = 0.6;
      group.add(stem);

      // Head
      const headGeo = new THREE.SphereGeometry(0.9, 16, 12);
      const headMat = new THREE.MeshStandardMaterial({
        color:0xFFE600, emissive:0xFFE600, emissiveIntensity:1.0, roughness:0.3, metalness:0
      });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.8;
      head.name = 'pinHead';
      group.add(head);

      // Glow sprite
      const spriteMat = new THREE.SpriteMaterial({map:glowTex, blending:THREE.AdditiveBlending, transparent:true, opacity:0.7});
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(3, 3, 1);
      sprite.position.copy(head.position);
      sprite.name = 'glow';
      group.add(sprite);

      scene.add(group);
      state.pins.push({group, head, sprite, id:prj.id, name:prj.name, worldPos:new THREE.Vector3(x,1.8+1.6,z)});

      // Label
      const lbl = document.createElement('div');
      lbl.className = 'pm-isl-label';
      lbl.dataset.id = prj.id;
      lbl.innerHTML = `
        <div class="pm-isl-label-name">${prj.name}</div>
        <div class="pm-isl-label-from"></div>
        <div class="pm-isl-label-beds"></div>
        <div class="pm-isl-label-rec"></div>`;
      lbl.addEventListener('click', ()=>selectProject(prj.id));
      lbl.addEventListener('pointerenter', ()=>setHoverInternal(prj.id, true));
      lbl.addEventListener('pointerleave', ()=>setHoverInternal(null, true));
      state.labelContainer.appendChild(lbl);
      state.labelEls.push({el:lbl, id:prj.id, pin:state.pins[state.pins.length-1]});
    });
  }

  function selectProject(id){
    const prj = state.projects.find(p=>p.id===id);
    if (!prj || !state.selectedCallback) return;
    if (state.fly) return; // already flying
    if (!state.camera || !state.controls){ state.selectedCallback(prj.name); return; }
    flyToProject(prj);
  }

  /* ~1.6s ease-in-out camera dive toward the pin, then hand off to the showroom.
     After handoff (screen is on Stage 2) the camera snaps back home so the
     return-to-island always shows the framed overview. */
  function flyToProject(prj){
    const pin = state.pins.find(p=>p.id===prj.id);
    if (!pin){ state.selectedCallback(prj.name); return; }
    const pinPos = pin.group.position;
    const toTgt = new THREE.Vector3(pinPos.x, 2, pinPos.z);
    // Approach from the camera's current side, at low elevation, close in
    const dirH = new THREE.Vector3().subVectors(state.camera.position, toTgt); dirH.y = 0;
    if (dirH.lengthSq() < 0.01) dirH.set(0, 0, 1);
    dirH.normalize();
    const d = 30, el = THREE.MathUtils.degToRad(24);
    const toPos = new THREE.Vector3(
      toTgt.x + dirH.x * d * Math.cos(el),
      toTgt.y + d * Math.sin(el),
      toTgt.z + dirH.z * d * Math.cos(el)
    );
    state.controls.enabled = false;
    state.controls.autoRotate = false;
    state.fly = {
      t0: performance.now(), dur: 1600,
      fromPos: state.camera.position.clone(), fromTgt: state.controls.target.clone(),
      toPos, toTgt,
      onDone: ()=>{
        state.fly = null;
        state.selectedCallback(prj.name); // pmEnterDev -> Stage 2 (island pauses underneath)
        // Reset home while hidden — invisible to the viewer
        state.camera.position.copy(state.homePos);
        state.controls.target.copy(state.homeTarget);
        state.controls.enabled = true;
        state.controls.autoRotate = true;
        state.camera.lookAt(state.controls.target);
      }
    };
  }

  /* Central hover: keeps pin state + lobby card .hl in sync in both directions.
     syncCard=false when the hover originated FROM a card (pmLobbySync already lit it). */
  function setHoverInternal(id, syncCard){
    if (state.hoveredId === id) return;
    if (syncCard && state.hoveredId){
      const prev = state.projects.find(p=>p.id===state.hoveredId);
      if (prev && typeof pmLobbySync==='function') pmLobbySync(prev.name, false);
    }
    state.hoveredId = id;
    if (syncCard && id){
      const prj = state.projects.find(p=>p.id===id);
      if (prj && typeof pmLobbySync==='function') pmLobbySync(prj.name, true);
    }
    if (state.renderer) state.renderer.domElement.style.cursor = id ? 'pointer' : '';
    updatePinStates();
  }

  function resetIdleTimer(){
    state.lastInteract = performance.now();
    state.controls.autoRotate = false;
    clearTimeout(state.idleTimer);
    state.idleTimer = setTimeout(()=>{
      state.controls.autoRotate = true;
    }, 20000);
  }

  function onPointerMove(e){
    if (!state.renderer) return;
    const rect = state.renderer.domElement.getBoundingClientRect();
    state.mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    state.mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    // Hover raycast — only 6 heads, cheap
    state.raycaster.setFromCamera(state.mouse, state.camera);
    const hits = state.raycaster.intersectObjects(state.pins.map(p=>p.head), false);
    setHoverInternal(hits.length ? hits[0].object.parent.userData.projectId : null, true);
  }

  function onPointerDown(e){
    resetIdleTimer();
    // Raycast to pin heads
    state.raycaster.setFromCamera(state.mouse, state.camera);
    const heads = state.pins.map(p=>p.head);
    const hits = state.raycaster.intersectObjects(heads, false);
    if (hits.length > 0){
      const id = hits[0].object.parent.userData.projectId;
      selectProject(id);
    }
  }

  function updatePinStates(){
    const time = performance.now() * 0.001;
    state.pins.forEach(p=>{
      const isMatch = state.matchingIds.includes(p.id);
      const isRec = p.id === state.recommendedId;
      const isHover = p.id === state.hoveredId;

      if (isMatch){
        // Matching pin — restore full yellow (may have been dimmed by a previous filter pass)
        p.head.material.color.setHex(0xFFE600);
        p.head.material.emissive.setHex(0xFFE600);
        p.head.material.emissiveIntensity = isHover ? 1.5 : (isRec ? 1.25 : 1.0);
        p.head.scale.setScalar(isHover ? 1.3 : (isRec ? 1.15 : 1.0));
        p.sprite.material.opacity = isHover ? 0.9 : 0.7;
        p.sprite.scale.setScalar(isHover ? 4 : (isRec ? 3.4 : 3) + Math.sin(time * 4) * 0.3);
        p.group.visible = true;
      } else {
        // Non-matching: dim dot
        p.head.material.color.setHex(0x5a554b);
        p.head.material.emissive.setHex(0x000000);
        p.head.material.emissiveIntensity = 0;
        p.head.scale.setScalar(isHover ? 0.7 : 0.4);
        p.sprite.material.opacity = 0;
        p.group.visible = true;
      }
    });
  }

  function updateLabels(){
    const camera = state.camera;
    const w = state.container.clientWidth;
    const h = state.container.clientHeight;

    // Project all pins
    const projected = [];
    state.labelEls.forEach(lbl=>{
      const pin = lbl.pin;
      const v = pin.worldPos.clone().project(camera);
      const behind = v.z > 1;
      const px = ((v.x * 0.5 + 0.5) * w);
      const py = ((-v.y * 0.5 + 0.5) * h);

      // Occlusion test
      state.raycaster.set(camera.position, pin.worldPos.clone().sub(camera.position).normalize());
      const hits = state.raycaster.intersectObject(state.island, true);
      const occluded = hits.length > 0 && hits[0].distance < camera.position.distanceTo(pin.worldPos);

      const isMatch = state.matchingIds.includes(lbl.id);
      const isHover = lbl.id === state.hoveredId;

      lbl.el.style.left = px + 'px';
      lbl.el.style.top = py + 'px';

      if (behind || (!isMatch && !isHover)){
        lbl.el.classList.add('hidden');
      } else {
        lbl.el.classList.remove('hidden');
        lbl.el.classList.toggle('occluded', occluded && !isHover);
      }

      if (isMatch || isHover){
        projected.push({lbl, px, py, dist:camera.position.distanceTo(pin.worldPos), occluded, behind});
      }
    });

    // Simple overlap check (screen-space AABB)
    // (Simplified for now: just hide lower-priority overlapping labels)
    const visible = projected.filter(p=>!p.behind && !p.occluded);
    for (let i=0; i<visible.length; i++){
      for (let j=i+1; j<visible.length; j++){
        const a = visible[i], b = visible[j];
        const dx = Math.abs(a.px - b.px);
        const dy = Math.abs(a.py - b.py);
        if (dx < 120 && dy < 60){
          // Overlap: hide the one further away (unless hovered)
          const hide = a.dist > b.dist ? a : b;
          if (hide.lbl.id !== state.hoveredId){
            hide.lbl.el.classList.add('hidden');
          }
        }
      }
    }
  }

  function animate(){
    if (state.paused || !state.renderer){
      state.raf = null;
      return;
    }
    state.raf = requestAnimationFrame(animate);
    if (state.fly){
      const f = state.fly;
      const t = Math.min((performance.now() - f.t0) / f.dur, 1);
      const e = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; // easeInOutCubic
      state.camera.position.lerpVectors(f.fromPos, f.toPos, e);
      state.controls.target.lerpVectors(f.fromTgt, f.toTgt, e);
      state.camera.lookAt(state.controls.target);
      if (t >= 1) f.onDone();
    } else {
      state.controls.update();
    }
    updatePinStates();
    updateLabels();
    state.renderer.render(state.scene, state.camera);
  }

  function resize(){
    if (!state.renderer || !state.container) return;
    const w = state.container.clientWidth;
    const h = state.container.clientHeight;
    if (!w || !h) return;
    state.renderer.setSize(w, h); // updateStyle=true — inline style must track, the CSS 100% rule loses to the init-time inline size
    state.camera.aspect = w / h;
    state.camera.updateProjectionMatrix();
  }

  /* Label text only changes when filters change — NOT per frame (avoids layout thrash) */
  function refreshLabelContent(){
    state.labelEls.forEach(lbl=>{
      const prj = state.projects.find(p=>p.id===lbl.id);
      if (!prj) return;
      const isMatch = state.matchingIds.includes(lbl.id);
      const isRec = lbl.id === state.recommendedId;

      // Compute from-price and beds range from allProps (mirrors pmDevMatchInfo)
      const units = allProps.filter(u=>u.dev===prj.name && u.status!=='sold');
      let matchedUnits = units;
      if (isMatch){
        const F = pmLobbyF, max = PM_BUDGET_STEPS[F.budgetIdx];
        const loc = allProps.find(u=>u.dev===prj.name)?.loc || '';
        const locOk = !F.locs.length || F.locs.includes(loc);
        if (locOk){
          matchedUnits = units.filter(u=>
            (!F.beds || u.beds>=F.beds) &&
            (!max || u.price<=max) &&
            F.feats.every(f=>u.features.includes(f))
          );
        }
      }

      const fromEl = lbl.el.querySelector('.pm-isl-label-from');
      const bedsEl = lbl.el.querySelector('.pm-isl-label-beds');
      const recEl = lbl.el.querySelector('.pm-isl-label-rec');

      if (matchedUnits.length > 0){
        const from = Math.min(...matchedUnits.map(u=>u.price));
        fromEl.textContent = `from ${pmEuro(from)}`;
        const beds = [...new Set(matchedUnits.map(u=>u.beds))].sort((a,b)=>a-b);
        const bedsStr = beds.length===1 ? `${beds[0]} bed${beds[0]>1?'s':''}` : `${beds[0]}-${beds[beds.length-1]} beds`;
        bedsEl.textContent = bedsStr;
      } else {
        fromEl.textContent = '';
        bedsEl.textContent = '';
      }

      recEl.textContent = isRec && isMatch ? '★ Recommended' : '';
    });
  }

  function setFilterResults(matchingIds){
    state.matchingIds = matchingIds;
    updatePinStates();
    refreshLabelContent();
  }

  function setRecommended(projectId){
    state.recommendedId = projectId;
    updatePinStates();
    refreshLabelContent();
  }

  function setHover(projectId){
    setHoverInternal(projectId, false);
  }

  function focusProject(projectId){
    selectProject(projectId); // flies to the pin, then hands off
  }

  function onProjectSelected(cb){
    state.selectedCallback = cb;
  }

  function pause(){
    state.paused = true;
    if (state.raf){
      cancelAnimationFrame(state.raf);
      state.raf = null;
    }
  }

  function resume(){
    if (state.paused){
      state.paused = false;
      animate();
    }
  }

  function destroy(){
    pause();
    if (state.resizeObs){ state.resizeObs.disconnect(); }
    if (state.renderer){
      state.renderer.dispose();
      state.renderer.domElement.remove();
    }
    if (state.labelContainer) state.labelContainer.remove();
    window.removeEventListener('resize', resize);
    state = {
      container:null, scene:null, camera:null, renderer:null, controls:null,
      projects:[], pins:[], labels:[], labelEls:[], matchingIds:[], recommendedId:null,
      hoveredId:null, raf:null, paused:false, lastInteract:0, selectedCallback:null,
      raycaster:null, mouse:null, island:null, sea:null, fog:null, idleTimer:null, labelContainer:null,
      fly:null, homePos:null, homeTarget:null
    };
  }

  return {init, setFilterResults, setRecommended, setHover, focusProject, onProjectSelected, resize, pause, resume, destroy,
          _internals: ()=>state /* camera/controls/pins access for the fly-to phase + debugging */};
})();
window.pmIsland = pmIsland; // top-level const isn't a window property — the pm* guards check window.pmIsland
</script>
